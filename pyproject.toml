[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llmhunter"
version = "0.1.0"
description = "Multi-provider LLM API key hunter for web applications"
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.27",
    "pydantic>=2.0",
    "click>=8.0",
    "rich>=13.0",
    "jsbeautifier>=1.14",
]

[project.scripts]
llmhunter = "llmhunter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llmhunter"]
